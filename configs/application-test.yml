spring:
  application:
    name: fullstack-app-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: false

  test:
    database:
      replace: none

logging:
  level:
    root: WARN
    org.springframework.test: INFO

server:
  port: 0
